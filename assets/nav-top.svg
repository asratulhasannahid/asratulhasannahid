<svg xmlns="http://www.w3.org/2000/svg" width="150" height="40" viewBox="0 0 150 40" fill="none"><style>@font-face{font-family:'xPoppins';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'xPoppins', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.h{font-family:'xJost', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'xMono', Consolas, Menlo, 'Liberation Mono', monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes ring{0%{r:5;opacity:.8}100%{r:16;opacity:0}}
@keyframes dash{to{stroke-dashoffset:-400}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
