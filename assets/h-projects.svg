<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" fill="none"><style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes ring{0%{r:6;opacity:.9}100%{r:22;opacity:0}}
@keyframes dash{to{stroke-dashoffset:-400}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawl 2.2s ease forwards .2s}
        @keyframes drawl{to{stroke-dashoffset:0}}
        .t{animation:up .8s ease both}.s{animation:up .8s ease both .25s}</style><defs><linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="400" y2="0" spreadMethod="repeat"><stop offset="0.00" stop-color="#EAF1FF"/><stop offset="0.50" stop-color="#5CC8FF"/><stop offset="1.00" stop-color="#EAF1FF"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="400 0" dur="5s" repeatCount="indefinite"/></linearGradient><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#5CC8FF"/><stop offset=".5" stop-color="#B79CFF"/><stop offset="1" stop-color="#5CC8FF" stop-opacity="0"/></linearGradient><filter id="gl" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter></defs><text x="3" y="66" font-size="64" font-weight="800" fill="none" stroke="#5CC8FF" stroke-opacity=".35" stroke-width="1.5">05</text><text class="t" x="96" y="52" font-size="32" font-weight="800" fill="url(#tg)">Featured Work</text><text class="s" x="98" y="80" font-size="15" fill="#8DA0CA">Things I've built and shipped</text><line x1="0" y1="100" x2="1000" y2="100" stroke="#284578" stroke-opacity=".6"/><line class="draw" x1="0" y1="100" x2="1000" y2="100" stroke="url(#ln)" stroke-width="2.5"/><circle cy="100" r="5" fill="#5CC8FF" filter="url(#gl)"><animate attributeName="cx" values="0;700.0;0" dur="7s" repeatCount="indefinite"/></circle><circle cy="100" r="2.5" fill="#fff"><animate attributeName="cx" values="0;700.0;0" dur="7s" repeatCount="indefinite"/></circle></svg>