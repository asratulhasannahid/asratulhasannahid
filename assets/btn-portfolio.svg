<svg xmlns="http://www.w3.org/2000/svg" width="220" height="68" viewBox="0 0 220 68" fill="none"><style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes ring{0%{r:6;opacity:.9}100%{r:22;opacity:0}}
@keyframes dash{to{stroke-dashoffset:-400}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="c"><rect x="1" y="1" width="218" height="66" rx="18"/></clipPath></defs><rect x="1" y="1" width="218" height="66" rx="18" fill="#0E1D3E" stroke="#5CC8FF" stroke-opacity=".6"/><g clip-path="url(#c)"><rect x="-80" y="0" width="60" height="68" fill="url(#sh)" transform="skewX(-20)"><animate attributeName="x" values="-80;300;300" keyTimes="0;.35;1" dur="4s" begin="1.5s" repeatCount="indefinite"/></rect></g><rect x="16" y="14" width="40" height="40" rx="12" fill="#5CC8FF"/><text x="36" y="41" text-anchor="middle" font-size="19" font-weight="800" fill="#fff">&#9670;</text><text x="70" y="32" font-size="16" font-weight="800" fill="#EAF1FF">Portfolio</text><text x="70" y="51" font-size="12.5" fill="#8DA0CA">See my work</text><text x="200" y="40" text-anchor="end" font-size="18" fill="#5CC8FF">&#8599;</text></svg>