<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" fill="none"><style>@font-face{font-family:'xJost';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'xJost';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'xPoppins';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'xPoppins', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.h{font-family:'xJost', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'xMono', Consolas, Menlo, 'Liberation Mono', monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
