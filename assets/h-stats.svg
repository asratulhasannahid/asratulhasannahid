<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="110" viewBox="0 0 1000 110" fill="none"><style>@font-face{font-family:'xJost';font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'xInter';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'xInter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.h{font-family:'xJost', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'xMono', Consolas, Menlo, 'Liberation Mono', monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes ring{0%{r:5;opacity:.8}100%{r:16;opacity:0}}
@keyframes dash{to{stroke-dashoffset:-400}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawl 2.2s ease forwards .2s}
      @keyframes drawl{to{stroke-dashoffset:0}}
      .t{animation:up .8s ease both}.s{animation:up .8s ease both .25s}
      .bx{animation:up .6s ease both}.pl{animation:pulse 3s ease-in-out infinite}</style><defs><linearGradient id="tg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0" spreadMethod="repeat"><stop offset="0.00" stop-color="#0F1A14"/><stop offset="0.50" stop-color="#16A34A"/><stop offset="1.00" stop-color="#0F1A14"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="420 0" dur="5s" repeatCount="indefinite"/></linearGradient><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#16A34A"/><stop offset=".55" stop-color="#22C55E"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></linearGradient><filter id="gl" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/></filter></defs><g class="bx"><rect x="1" y="16" width="62" height="62" rx="16" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="1.5"/><rect class="pl" x="1" y="16" width="62" height="62" rx="16" stroke="#16A34A" stroke-opacity=".35" stroke-width="1.5"/><text class="h" x="32" y="56" text-anchor="middle" font-size="24" font-weight="700" fill="#16A34A">04</text></g><text class="h t" x="84" y="50" font-size="32" font-weight="700" fill="url(#tg)">GitHub Stats</text><text class="s" x="85" y="77" font-size="15" fill="#6B7A72">Consistency beats intensity</text><line x1="0" y1="100" x2="1000" y2="100" stroke="#E3E8E5"/><line class="draw" x1="0" y1="100" x2="1000" y2="100" stroke="url(#ln)" stroke-width="2.5"/><circle cy="100" r="7" fill="#22C55E" opacity=".45" filter="url(#gl)"><animate attributeName="cx" values="0;700;0" dur="7s" repeatCount="indefinite"/></circle><circle cy="100" r="3.5" fill="#16A34A"><animate attributeName="cx" values="0;700;0" dur="7s" repeatCount="indefinite"/></circle></svg>