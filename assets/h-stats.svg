@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.draw{stroke-dasharray:180;stroke-dashoffset:180;animation:drawl 1.6s ease forwards .3s}
      @keyframes drawl{to{stroke-dashoffset:0}}
