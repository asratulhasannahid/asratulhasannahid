<svg xmlns="http://www.w3.org/2000/svg" width="150" height="48" viewBox="0 0 150 48" fill="none"><style>
text{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', Menlo, monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes ring{0%{r:6;opacity:.9}100%{r:22;opacity:0}}
@keyframes dash{to{stroke-dashoffset:-400}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.run{stroke-dasharray:60 340;animation:dash 4s linear infinite;animation-delay:-1.7999999999999998s}</style><defs><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5CC8FF"/><stop offset=".5" stop-color="#B79CFF"/><stop offset="1" stop-color="#FFB547"/></linearGradient></defs><rect x="1" y="1" width="148" height="46" rx="24" fill="#0E1D3E" stroke="#284578"/><rect class="run" x="1" y="1" width="148" height="46" rx="24" stroke="url(#bd)" stroke-width="2"/><text x="75.0" y="30" text-anchor="middle" font-size="14.5" font-weight="700" fill="#EAF1FF"><tspan fill="#5CC8FF" font-size="11.5" class="mono">04</tspan>  Stats</text></svg>