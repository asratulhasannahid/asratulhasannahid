<svg xmlns="http://www.w3.org/2000/svg" width="150" height="48" viewBox="0 0 150 48" fill="none"><style>@font-face{font-family:'xMono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'xInter';font-style:normal;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'xInter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.h{font-family:'xJost', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:'xMono', Consolas, Menlo, 'Liberation Mono', monospace}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
